name: Go

on:
  push:
    branches:
      - main
    tags:
      - v[0-9]+.[0-9]+.[0-9]+*
  pull_request:

jobs:
  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        mysql-image:
          - mysql/mysql-server:5.7
          - mysql/mysql-server:8.0
          - mysql:8.4
          - mysql:9.0
          - mysql:9.7
          - mariadb:10.5
          - mariadb:10.6
          - mariadb:10.11
          - mariadb:11.4
          - percona/percona-server:5.7
          - percona/percona-server:8.0
          - percona/percona-server:8.4
          - percona:5.7
          - percona:8.0
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ github.workspace }}/go.mod

      - name: Run checks
        run: |
          make init
          bin/golangci-lint run -c=.golangci-required.yml --out-format=line-number | env REVIEWDOG_GITHUB_API_TOKEN=${{ secrets.GITHUB_TOKEN }} bin/reviewdog -f=golangci-lint -level=error -reporter=github-pr-check
          bin/golangci-lint run -c=.golangci.yml --out-format=line-number | env REVIEWDOG_GITHUB_API_TOKEN=${{ secrets.GITHUB_TOKEN }} bin/reviewdog -f=golangci-lint -level=error -reporter=github-pr-review

      - name: Run Tests
        run: |
          docker compose up -d --wait --wait-timeout 120
          make format
          make build
          make test
        env:
          MYSQL_IMAGE: ${{ matrix.mysql-image }}

      - name: Run debug commands on failure
        if: ${{ failure() }}
        run: |
          env | sort
          go env | sort
          git status
          docker version
          docker compose version

  integration:
    name: Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ github.workspace }}/go.mod

      # Kept out of the matrix above on purpose: the integration tests pin the
      # server images they need and start them through testcontainers, so running
      # them per matrix entry would start the same containers fourteen times over.

      # Nothing built these files before, so a compile error in an integration
      # test could not fail the build.
      - name: Compile-check integration tests
        run: make test-integration-build

      # Only the table I/O waits test runs for now. The -run pattern is anchored:
      # go test exits 0 when a pattern matches nothing, so an unanchored prefix
      # would turn this job green while running no tests at all if the function
      # were renamed. TestPScrapeProcesslist brings
      # up ten database containers in parallel, each server sizing InnoDB from
      # total host memory, and that has not been validated on a hosted runner.
      # Widen this to `make test-integration` once it has.
      - name: Run integration tests
        run: go test -count 1 -race -v -tags integration -run '^TestScrapePerfTableIOWaitsMySQLCompatibility$' ./collector/

      - name: Run debug commands on failure
        if: ${{ failure() }}
        run: |
          env | sort
          go env | sort
          docker version
          free -m
